version: 2

models:
  - name: stg_kabkota
    description: Kab/kota dari silver, tanpa transformasi.
    columns:
      - name: kode_kabkota
        data_tests: [unique, not_null]

  - name: stg_gempa
    description: Gempa dari silver, ditambah tanggal kejadian dalam WIB.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [sumber, sumber_event_id]
    columns:
      - name: sumber
        data_tests:
          - accepted_values:
              arguments:
                values: [bmkg, usgs]

  - name: stg_prakiraan_cuaca
    description: Prakiraan cuaca dari silver, tanpa transformasi.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [adm4, analisis_utc, waktu_utc]

  - name: stg_aset
    description: Aset sintetis dari seed `aset`.
    columns:
      - name: aset_id
        data_tests: [unique, not_null]
