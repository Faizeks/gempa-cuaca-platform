version: 2

models:
  # ------------------------------------------------------------------ dimensi
  - name: dim_wilayah
    description: Kabupaten/kota beserta provinsi, centroid, luas, penduduk, dan kepadatan.
    columns:
      - name: kode_kabkota
        description: Kode Kemendagri, mis. 32.73 (Kota Bandung).
        data_tests: [unique, not_null]
      - name: jenis
        data_tests:
          - accepted_values:
              arguments:
                values: [kabupaten, kota]
      - name: kode_provinsi
        data_tests: [not_null]

  - name: dim_waktu
    description: Kalender harian sejak awal histori sampai 10 hari ke depan.
    columns:
      - name: tanggal
        data_tests: [unique, not_null]

  - name: dim_cuaca
    description: Kategori cuaca BMKG yang muncul di data, dengan flag cuaca ekstrem (hujan lebat atau petir).
    columns:
      - name: kode_cuaca
        data_tests: [unique, not_null]

  - name: dim_aset
    description: Aset sintetis (gudang logistik dan objek polis asuransi) beserta lokasinya.
    columns:
      - name: aset_id
        data_tests: [unique, not_null]
      - name: jenis
        data_tests:
          - accepted_values:
              arguments:
                values: [gudang, polis]
      - name: kode_kabkota
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_wilayah')
                field: kode_kabkota

  # ------------------------------------------------------------------ fakta
  - name: fact_gempa
    description: >
      Satu baris per kejadian gempa per sumber. BMKG dan USGS tidak digabung; gunakan
      kolom `sumber` sesuai kebutuhan (USGS untuk histori dan M>=5, BMKG untuk gempa dirasakan).
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [sumber, sumber_event_id]
    columns:
      - name: sumber
        data_tests:
          - accepted_values:
              arguments:
                values: [bmkg, usgs]
      - name: waktu_utc
        data_tests: [not_null]
      - name: tanggal_wib
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_waktu')
                field: tanggal
      - name: kode_kabkota
        description: Kab/kota dengan centroid terdekat dari episentrum.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_wilayah')
                field: kode_kabkota

  - name: fact_prakiraan_cuaca
    description: Satu baris per lokasi x slot 3 jam x waktu analisis BMKG.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [adm4, analisis_utc, waktu_utc]
    columns:
      - name: kode_kabkota
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_wilayah')
                field: kode_kabkota
      - name: is_cuaca_ekstrem
        description: Kategori BMKG hujan lebat/petir, atau curah hujan per slot >= var ambang_hujan_lebat_mm.

  - name: fact_paparan_gempa
    description: >
      Satu baris per aset x gempa (M >= var paparan_min_magnitudo) yang episentrumnya dalam
      radius var paparan_radius_km dari aset.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [aset_id, sumber, sumber_event_id]
    columns:
      - name: aset_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_aset')
                field: aset_id
      - name: jarak_km
        description: Jarak aset ke episentrum (Haversine).

  - name: fact_paparan_cuaca
    description: Satu baris per aset x tanggal prakiraan x waktu analisis BMKG.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [aset_id, analisis_utc, tanggal_lokal]

  # ------------------------------------------------------------------ mart
  - name: mart_risiko_provinsi
    description: Ringkasan bulanan per provinsi untuk dashboard risiko (gempa, gempa dirasakan, hari cuaca ekstrem).
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [kode_provinsi, bulan]

  - name: mart_paparan_aset
    description: Ringkasan bulanan paparan gempa terhadap portofolio aset per provinsi dan jenis aset.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [kode_provinsi, jenis, bulan]
    columns:
      - name: persen_nilai_terpapar
        description: Persentase nilai portofolio provinsi (per jenis aset) yang terpapar gempa pada bulan tersebut.

  - name: mart_peringatan_cuaca_aset
    description: Aset yang diprakirakan terkena cuaca ekstrem mulai hari ini (analisis BMKG terbaru).
