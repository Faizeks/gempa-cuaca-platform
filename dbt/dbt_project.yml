name: gempa_cuaca
version: "1.0.0"
config-version: 2
profile: gempa_cuaca

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Paparan gempa: aset terpapar jika berada dalam radius dampak gempa M >= paparan_min_magnitudo.
  # Radius dampak membesar 10^0.4 (~2,5x) per kenaikan 1 magnitudo:
  #   radius = radius_dampak_m5_km * 10^(0.4 * (M - 5))  ->  M5: 25 km, M6: 63 km, M7: 158 km
  # Penyederhanaan atenuasi guncangan untuk keperluan project, bukan model rekayasa gempa.
  paparan_min_magnitudo: 5.0
  radius_dampak_m5_km: 25
  faktor_radius_per_magnitudo: 0.4
  # Curah hujan per slot 3 jam (mm) yang dianggap hujan lebat, selain kategori BMKG
  # "Hujan Lebat"/"Hujan Petir". Asumsi project, bisa disesuaikan.
  ambang_hujan_lebat_mm: 20
  # Awal kalender dim_waktu (histori USGS dimulai Desember 2015)
  tanggal_awal: "2015-12-01"

seeds:
  gempa_cuaca:
    +schema: referensi

models:
  gempa_cuaca:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: gold
      +materialized: table
